name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "redesign/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NEXT_PUBLIC_* values are inlined at build time; every job that builds needs them.
  # End-to-end jobs override the API and RPC with the deterministic mock upstream
  # (tests/e2e/mock-upstream) through playwright.config.ts, so CI never depends on
  # the live indexer or Arbitrum RPC.
  NEXT_PUBLIC_NETWORK: mainnet
  NEXT_PUBLIC_API_BASE_URL: http://randomwalknft-api.com
  NEXT_PUBLIC_RPC_URL: https://arb1.arbitrum.io/rpc
  NEXT_PUBLIC_SITE_URL: https://randomwalknft.com

jobs:
  static:
    name: Lint, types, format, dead code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm knip

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit

  e2e:
    name: End-to-end (functional)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e:functional
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-functional-report
          path: playwright-report
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-functional-results
          path: test-results

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Pinned Playwright image: screenshots are only comparable when fonts, GPU, and
    # browser builds match the environment that produced the committed baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:visual
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-report
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-results
          path: test-results

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - static
      - unit
      - e2e
      - visual
      - lighthouse
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
